name: Verify Crema
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --dry-run --ignore-installed --report /tmp/crema-dependencies.json -r app/requirements.txt
      - run: python tools/audit_dependencies.py /tmp/crema-dependencies.json
  privacy:
    name: Source privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/privacy_check.py
  sqlite:
    name: SQLite regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
      - run: python tools/test_release.py
  postgres:
    name: PostgreSQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: coffee
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: synthetic-disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coffee -d coffee"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_DB_HOST: 127.0.0.1
      DB_PASSWORD: synthetic-disposable-ci-password
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
      - run: python tools/test_release.py
  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.build.yaml build web
