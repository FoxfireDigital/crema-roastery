name: Verify Crema
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc libc6-dev libpq-dev
      - run: python -m pip install --dry-run --ignore-installed --report /tmp/crema-dependencies.json -r app/requirements.txt
      - run: python tools/audit_dependencies.py /tmp/crema-dependencies.json
  privacy:
    name: Source privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/privacy_check.py
  sqlite:
    name: SQLite regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc libc6-dev libpq-dev
      - run: python -m pip install -r app/requirements.txt
      - run: python -c "from psycopg import pq; assert pq.__impl__ == 'c'"
      - run: python tools/test_release.py
      - run: python tools/companion_checks.py
  postgres:
    name: PostgreSQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
        env:
          POSTGRES_DB: coffee
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: synthetic-disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U coffee -d coffee"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_DB_HOST: 127.0.0.1
      DB_PASSWORD: synthetic-disposable-ci-password
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc libc6-dev libpq-dev
      - run: python -m pip install -r app/requirements.txt
      - run: python -c "from psycopg import pq; assert pq.__impl__ == 'c'"
      - run: python tools/test_release.py
  container:
    name: Image and recovery trial
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Read deployment version from the primary YAML
        run: |
          python - <<'PY'
          import json, os, subprocess
          config=json.loads(subprocess.check_output(['docker','compose','-f','compose.yaml','-f','compose.build.yaml','config','--format','json'],text=True))
          image=config['services']['web']['image']
          version=image.removeprefix('crema:')
          assert image=='crema:'+version and version.startswith('0.1.0-rc')
          assert config['services']['proxy']['image']=='crema-proxy:'+version
          assert config['services']['postgres']['image']=='crema-database:'+version
          with open(os.environ['GITHUB_ENV'],'a') as output:output.write('CREMA_VERSION='+version+'\n')
          PY
      - run: docker compose -f compose.yaml -f compose.build.yaml build --pull web postgres proxy
        env:
          CREMA_REVISION: ${{ github.sha }}
      - run: python tools/verify_image.py --image "crema:$CREMA_VERSION" --version "$CREMA_VERSION" --revision "$GITHUB_SHA" --output /tmp/crema-image-review --test-context
      - run: python tools/audit_dependencies.py /tmp/crema-image-review/components.json
      - run: python tools/test_registry_install.py --image "crema:$CREMA_VERSION" --proxy-image "crema-proxy:$CREMA_VERSION" --database-image "crema-database:$CREMA_VERSION" --registry-image registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3 --revision "$GITHUB_SHA" --output /tmp/crema-registry-review
