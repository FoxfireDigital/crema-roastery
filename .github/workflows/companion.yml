name: Verify Windows Companion
on:
  pull_request:
    paths:
      - 'companion/windows/**'
      - '.github/workflows/companion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    name: Windows portable pilot
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Obtain exact Microsoft SDK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk=Get-Content companion/windows/build-sdk.json -Raw|ConvertFrom-Json
          if(-not $sdk.url.StartsWith('https://builds.dotnet.microsoft.com/dotnet/Sdk/')){throw 'Unexpected SDK source'}
          $zip=Join-Path $env:RUNNER_TEMP 'companion-sdk.zip'
          Invoke-WebRequest $sdk.url -OutFile $zip
          if((Get-FileHash -LiteralPath $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne $sdk.sha512){throw 'SDK checksum mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'companion-sdk')
      - name: Build self-contained pilot and notices
        shell: pwsh
        run: |
          ./companion/windows/build.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'companion-build') -Dotnet (Join-Path $env:RUNNER_TEMP 'companion-sdk/dotnet.exe')
      - name: Run hardware-free preparation and transport checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR=Join-Path $env:RUNNER_TEMP 'companion-extract'
          $report=Join-Path $env:RUNNER_TEMP 'pilot-checks.json'
          $exe=Join-Path $env:RUNNER_TEMP 'companion-build/app/CremaCompanion.exe'
          $process=Start-Process -FilePath $exe -ArgumentList @('--self-test',('"'+$report+'"')) -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){Get-Content $report;throw 'Pilot checks failed'}
          $result=Get-Content $report -Raw|ConvertFrom-Json
          if($result.result -ne 'passed' -or $result.realArtisanTouched -or $result.serverChanged){throw 'Unexpected pilot result'}
          Get-Content $report
