<style>
.save-dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:110;width:min(780px,calc(100% - 28px));padding:12px 16px;border:2px solid var(--warning_line);border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:0 5px 24px var(--shadow)}.save-dock[data-state=failed]{border-color:var(--error_line)}.save-dock>div{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.save-dock p{margin:4px 0;font-size:.9rem}.save-dock button{margin:0;background:var(--soft);color:var(--ink);border:1px solid var(--line);min-height:44px}.save-dock ul{margin:10px 0 0;padding:0;list-style:none;max-height:28vh;overflow:auto}.save-dock li button{width:100%;text-align:left;margin:3px 0;font-size:.85rem}.save-dock summary{font-size:.85rem;cursor:pointer;min-height:30px;padding-top:7px}.save-state-label{display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);line-height:1.45}.save-state-label[data-state=saved]{background:var(--success_bg);color:var(--good)}.save-state-label[data-state=dirty]{background:var(--warning_bg);border-color:var(--warning_line);color:var(--warning)}.save-state-label[data-state=failed]{background:var(--error_bg);border-color:var(--error_line);color:var(--red);font-weight:700}[data-save-state=failed]{outline:2px solid var(--error_line);outline-offset:2px}[data-save-state=dirty] .row-feedback{font-weight:650}.roast-table .step-control{min-height:48px;min-width:48px}.roast-table .row-feedback{max-width:190px;font-size:.8rem}.roast-table .roast-result{min-width:195px}main [data-save-feedback]:not(:empty){padding:5px 8px;border-radius:6px;background:var(--soft)}main input:focus-visible,main textarea:focus-visible,main summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}body.has-pending-saves{padding-bottom:170px}.request-problem{max-width:640px;margin:40px auto}.packing-feedback{width:fit-content}.coverage-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.coverage-metrics .coverage-outstanding{border-style:dashed}.coverage-metrics strong{font-variant-numeric:tabular-nums}.coverage-explanation{max-width:1000px}.roast-table .check-cell input:checked+span{font-weight:700}
.coffee-coverage.coverage-compact{padding:16px}.coverage-compact .coverage-explanation{font-size:.85rem;margin:8px 0}.coverage-compact .coverage-metrics{grid-template-columns:repeat(6,minmax(0,1fr));margin:10px 0}.coverage-compact .coverage-metrics strong{font-size:1.15rem}.coverage-compact .coverage-metrics>div>span{font-size:.8rem}.coverage-compact>p.muted:last-child{display:none}.coverage-compact h2{font-size:1rem}.coverage-compact .coverage-sources{margin:6px 0}.coverage-compact .coverage-details>summary{font-size:.85rem}
@media(max-width:1100px){.coverage-compact .coverage-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.save-dock{bottom:8px;padding:10px 12px}.coverage-metrics,.coverage-compact .coverage-metrics{grid-template-columns:1fr 1fr}.coverage-metrics>div{padding:10px}.coverage-metrics strong{font-size:1.15rem}.save-dock p{font-size:.85rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{.save-dock{display:none!important}body.has-pending-saves{padding-bottom:0}.save-state-label{border:0;background:transparent}.coverage-metrics{grid-template-columns:repeat(3,1fr)}}
</style>
<script nonce="{{ request.csp_nonce }}">
window.coffeeSaveStates={items:new Map(),set(target,state,detail=''){
 target.dataset.saveState=state;this.items.set(target,{state,detail});this.render();
},render(){
 const dock=document.querySelector('#save-dock');if(!dock)return;
 const pending=[...this.items].filter(([target,item])=>target.isConnected&&['dirty','saving','failed'].includes(item.state));
 dock.hidden=!pending.length;document.body.classList.toggle('has-pending-saves',!!pending.length);if(!pending.length)return;
 const count=state=>pending.filter(([,item])=>item.state===state).length,failed=count('failed'),saving=count('saving'),dirty=count('dirty');
 dock.dataset.state=failed?'failed':saving?'saving':'dirty';
 dock.querySelector('[data-save-summary]').textContent=[failed?failed+' save'+(failed===1?'':'s')+' failed':'',saving?saving+' saving…':'',dirty?dirty+' unsaved change'+(dirty===1?'':'s'):''].filter(Boolean).join(' · ');
 dock.querySelector('[data-save-guidance]').textContent=failed?'Keep this page open. Review the marked entry and retry, or reload if it changed elsewhere.':saving?'Wait for confirmation before leaving this page.':'Your edits are still on this screen. Save them before leaving.';
 const list=dock.querySelector('ul');list.replaceChildren();for(const [target,item] of pending){const li=document.createElement('li'),button=document.createElement('button');button.type='button';const name=target.querySelector('.recipe strong,h3,h2,legend')?.textContent?.trim()||target.getAttribute('aria-label')||'Edited form';button.textContent=name+' — '+(item.detail||item.state);button.addEventListener('click',()=>{target.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});(target.querySelector('input:not([type=hidden]),select,textarea,button')||target).focus({preventScroll:true})});li.append(button);list.append(li)}
}};
document.addEventListener('DOMContentLoaded',()=>{
 window.coffeeSaveStates.render();
 document.querySelectorAll('[data-print-page]').forEach(button=>button.addEventListener('click',()=>window.print()));
 document.querySelectorAll('[data-submit-on-change]').forEach(field=>field.addEventListener('change',()=>field.form.requestSubmit()));
 document.querySelectorAll('[data-confirm]').forEach(button=>button.addEventListener('click',event=>{if(!confirm(button.dataset.confirm))event.preventDefault()}));
});
</script>
