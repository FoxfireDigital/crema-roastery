<style>.today-packing-card>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:44px}.today-packing-card>summary:before{content:"▸"}.today-packing-card[open]>summary:before{content:"▾"}.today-packing-card>summary strong{flex:1}.today-packing-card:not([open])>div{display:none}.today-packing-card .packing-item:first-child{margin-top:12px}.packing-head{display:flex;align-items:end;gap:20px;flex-wrap:wrap}.packing-head form{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;flex:1;min-width:220px}.packing-head form label{grid-row:1;margin:0}.packing-head form select{grid-row:2}.packing-item{padding:18px 0;border-top:1px solid var(--line)}.packing-item h3{margin:0}.packing-summary{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.packing-summary p{margin:7px 0}.base-instruction{display:flex;flex-direction:column;gap:7px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.packing-checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.packing-checks label{border:1px solid var(--line);padding:10px;border-radius:7px;background:var(--soft);margin:0;min-height:44px}.packing-feedback{font-size:.85rem}.packing-meta form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.packing-meta p{margin:8px 0}.packing-item.is-sealed{background:var(--success_bg);border-radius:8px;padding:16px}.package-count{font-weight:750;font-size:1.1rem}.print-only{display:none}@media(max-width:700px){.packing-summary{grid-template-columns:1fr}.packing-head form{grid-template-columns:1fr}.packing-head form label,.packing-head form select{grid-row:auto}.packing-checks{display:grid;grid-template-columns:1fr 1fr}.packing-checks label{justify-content:space-between}}@media print{header,.no-print,.message,details{display:none!important}.print-only{display:block}.card{border:0}.packing-summary{grid-template-columns:1fr 1fr}.packing-item{break-inside:avoid}table{min-width:0}.scroll{overflow:visible}}
</style>
<script nonce="{{ request.csp_nonce }}">
(()=>{const items=[...document.querySelectorAll('[data-packing]')];function total(){document.querySelectorAll('[data-packing-list]').forEach(list=>{const rows=[...list.querySelectorAll('[data-packing]')],n=rows.filter(row=>row.classList.contains('is-sealed')).length;list.querySelectorAll('[data-packing-completed]').forEach(label=>label.textContent=n+' of '+rows.length+' allocations sealed')});document.querySelectorAll('[data-packing-card]').forEach(card=>{const rows=[...card.querySelectorAll('[data-packing]')],n=rows.filter(row=>row.classList.contains('is-sealed')).length;card.querySelector('[data-card-completed]').textContent=n+' of '+rows.length+' sealed'})}
 for(const row of items){const form=row.querySelector('.packing-progress-form');if(!form)continue;const boxes=[...form.querySelectorAll('input[type=checkbox]')],feedback=row.querySelector('.packing-feedback'),retry=row.querySelector('.packing-retry'),undo=row.querySelector('.packing-undo');let pending=false,queued=false,blocked=false,committed=JSON.stringify(boxes.map(b=>b.checked));function report(text,error=false){const state=error?'failed':text==='Saving…'?'saving':JSON.stringify(boxes.map(b=>b.checked))!==committed?'dirty':'saved';feedback.textContent=state==='dirty'&&text==='Saved'?'More changes to save…':text;feedback.dataset.state=state;feedback.classList.toggle('status-error',error);window.coffeeSaveStates.set(row,state,feedback.textContent)}
  async function save(undoing=false){if(blocked)return;if(pending){queued=true;return}const sent=JSON.stringify(boxes.map(b=>b.checked));if(!undoing&&sent===committed)return;if(!navigator.onLine){report('Offline — not saved. Your checks stay here.',true);retry.hidden=false;return}pending=true;undo.disabled=true;const data=new FormData(form);data.set('revision',row.dataset.revision);if(undoing){data.set('action','undo');data.set('event',row.dataset.undoEvent)}row.setAttribute('aria-busy','true');report('Saving…');retry.hidden=true;
   try{const response=await fetch(row.dataset.endpoint,{method:'POST',body:data,credentials:'same-origin',signal:AbortSignal.timeout(20000),headers:{Accept:'application/json'}});let result;try{result=await response.json()}catch(e){}if(!response.ok||!result?.revision){if(response.status===409||response.status===404){blocked=true;boxes.forEach(b=>b.disabled=true)}throw Error(result?.error||'Not saved. Check your connection or sign in, then retry.')}row.dataset.revision=result.revision;row.dataset.undoEvent=result.undo_event||'';undo.hidden=!result.undo_event;if(JSON.stringify(boxes.map(b=>b.checked))===sent){boxes.forEach(b=>b.checked=!!result.steps[b.name]);committed=JSON.stringify(boxes.map(b=>b.checked))}else committed=JSON.stringify(boxes.map(b=>!!result.steps[b.name]));row.classList.toggle('is-sealed',!!result.steps.sealed_at);total();report(undoing?'Last change undone':'Saved');}
   catch(error){queued=false;report(error.name==='TimeoutError'?'Save not confirmed: the connection timed out. Keep your entry and retry or reload to check the saved result.':error.message,true);retry.hidden=blocked}finally{pending=false;row.removeAttribute('aria-busy');undo.disabled=false;if(queued){queued=false;save()}}
  }
  boxes.forEach((box,index)=>box.addEventListener('change',()=>{if(index>0&&box.checked&&!boxes[0].checked){box.checked=false;report('Mark the bags Labeled before recording the next packing step.',true);return}boxes.forEach((b,i)=>{if(box.checked&&i<index)b.checked=true;if(!box.checked&&i>index)b.checked=false});save()}));form.addEventListener('submit',event=>{event.preventDefault();save()});retry.addEventListener('click',()=>save());undo.addEventListener('click',()=>{if(JSON.stringify(boxes.map(b=>b.checked))!==committed){report('Save your pending checks before undoing.');return}save(true)});window.addEventListener('beforeunload',e=>{if(pending||JSON.stringify(boxes.map(b=>b.checked))!==committed){e.preventDefault();e.returnValue=''}});
 }total();})();
</script>
