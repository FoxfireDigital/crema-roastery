{% if chart %}<figure class="flavor-radar"><svg viewBox="0 0 380 380" role="img" aria-label="Flavor profile chart; ratings also appear as text"><g fill="none" stroke="var(--line)">{% for ring in chart.rings %}<circle cx="190" cy="190" r="{{ ring }}"/>{% endfor %}{% for axis in chart.axes %}<line x1="190" y1="190" x2="{{ axis.x }}" y2="{{ axis.y }}"/>{% endfor %}</g>{% if chart.points %}<polygon points="{{ chart.points }}" fill="var(--selected)" stroke="var(--forest)" stroke-width="2"/>{% endif %}{% for axis in chart.axes %}{% if axis.point_x != None %}<circle cx="{{ axis.point_x }}" cy="{{ axis.point_y }}" r="4" fill="var(--ink)"/>{% endif %}<text x="{{ axis.label_x }}" y="{{ axis.label_y }}" text-anchor="middle" fill="var(--ink)" font-size="11">{{ axis.label }}</text>{% endfor %}</svg><figcaption>Axis scale 0–{{ chart.scale }}.{% if not chart.complete %} Unscored axes stay blank; complete all axes to show the radar shape.{% endif %}</figcaption><dl class="taste-values">{% for axis in chart.axes %}<div><dt>{{ axis.label }}</dt><dd>{{ axis.value|default_if_none:'Not rated' }}</dd></div>{% endfor %}</dl></figure>{% endif %}
<style>.flavor-radar{margin:12px 0}.flavor-radar svg{display:block;width:100%;max-width:420px;margin:auto}.flavor-radar figcaption{font-size:.85rem;color:var(--muted);text-align:center}.taste-values{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.taste-values div{padding:8px;background:var(--soft);border-radius:6px}.taste-values dt{font-size:.8rem}.taste-values dd{margin:5px 0 0;font-weight:700}</style>
