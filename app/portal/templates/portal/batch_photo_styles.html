<style>.photo-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}.photo-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:18px}.photo-gallery article{min-width:0}.photo-gallery img{max-width:100%;width:100%;height:210px;object-fit:contain;background:var(--soft);border:1px solid var(--line);border-radius:8px}.photo-gallery a:has(img){display:block}.batch-photo-full,#photo-preview,#batch-camera{display:block;max-width:100%;width:100%;height:auto;max-height:65vh;object-fit:contain;background:var(--soft);border:1px solid var(--line);border-radius:8px;margin:12px 0}#camera-controls[hidden],#batch-camera[hidden],#photo-preview-panel[hidden],#camera-choice-label[hidden],#photo-retake[hidden]{display:none}#batch-photo-form input[type=file]{max-width:100%}#batch-photo-form textarea{max-width:100%}#batch-photo-form #photo-save-status.error,#camera-status.error{color:var(--red)}@media(max-width:600px){.photo-actions>*{flex:1 1 auto}.photo-gallery{grid-template-columns:1fr}}@media print{#batch-photo-form{display:none}.batch-photo-full{max-height:70vh}.photo-gallery{grid-template-columns:1fr 1fr}}</style>
