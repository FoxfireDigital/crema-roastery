<style>
.coverage-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.coverage-metrics>div{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}.coverage-metrics span{display:inline}.coverage-metrics>div>span{display:block;font-size:.85rem;color:var(--muted)}.coverage-metrics strong{display:block;font-size:1.35rem;margin-top:5px}.coverage-metrics .bulk-applied,.coverage-table .bulk-applied{background:var(--success_bg);color:var(--heading)}.coverage-metrics .coverage-recorded{border-width:2px;border-color:var(--forest)}.coverage-table{min-width:930px}.coverage-table td,.coverage-table th{padding:10px}.coverage-table td:first-child{overflow-wrap:anywhere}.coverage-table small{display:block;margin-top:5px}.coverage-table small[hidden]{display:none}.coverage-table .coverage-recorded{font-weight:750;background:var(--soft)}.coverage-sources{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.coverage-source{display:inline-block;padding:5px 8px;border-radius:6px;border:1px solid var(--line);font-size:.8rem;line-height:1.5}.coverage-source.bulk-applied{background:var(--success_bg)}.coverage-source.bulk-pending{background:var(--warning_bg);color:var(--warning)}.coverage-explanation{margin-bottom:8px}.coverage-inline{padding:10px 12px;background:var(--soft);border:1px solid var(--line);border-radius:8px;line-height:1.7}.coverage-inline strong{white-space:nowrap}.coffee-coverage h2{margin-top:0}.coverage-metrics>div>span[data-coverage-value]{display:inline}
@media(max-width:700px){.coverage-metrics{grid-template-columns:1fr 1fr}.coverage-metrics strong{font-size:1.15rem}.coverage-table,.coverage-table tbody{display:block;min-width:0}.coverage-table thead{display:none}.coverage-table tbody{display:grid;gap:12px}.coverage-table tr{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;border:1px solid var(--line);border-radius:8px;padding:10px}.coverage-table td{display:block;border:0;padding:7px;min-width:0}.coverage-table td:first-child{grid-column:1/-1}.coverage-table td:not(:first-child):before{content:attr(data-label);display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}.coverage-source{overflow-wrap:anywhere}.coverage-inline strong{white-space:normal}}
@media print{.coverage-metrics{grid-template-columns:repeat(4,1fr)}.coverage-metrics strong{font-size:1rem}.coffee-coverage{break-inside:auto}.coverage-table{min-width:0;font-size:.75rem}.coverage-table tr{break-inside:avoid}}
</style>
<script nonce="{{ request.csp_nonce }}">
window.coffeeCoverage=window.coffeeCoverage||{latest:{},update(data){if(!data||!data.plan_id||!data.totals||!Array.isArray(data.rows))return;const id=String(data.plan_id),stamp=data.as_of||'';if(stamp&&this.latest[id]&&stamp<this.latest[id])return;this.latest[id]=stamp;const write=(root,values)=>root.querySelectorAll('[data-coverage-value]').forEach(el=>{const n=Number(values[el.dataset.coverageValue]);if(Number.isFinite(n))el.textContent=n.toFixed(1)});document.querySelectorAll('[data-coverage-plan="'+id+'"]').forEach(panel=>{const total=panel.querySelector('[data-coverage-totals]');if(total)write(total,data.totals);data.rows.forEach(row=>panel.querySelectorAll('[data-coverage-group="'+String(row.group_id)+'"]').forEach(el=>{write(el,row);const pending=el.querySelector('[data-coverage-pending]');if(pending){pending.hidden=!row.missing_weights;pending.querySelector('[data-pending-count]').textContent=String(row.missing_weights||0)}}))})}};
</script>
