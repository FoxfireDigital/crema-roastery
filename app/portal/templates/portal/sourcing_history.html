<style>.sourcing-history pre{white-space:pre-wrap;overflow-wrap:anywhere}.sourcing-history details{margin:10px 0}</style>{% if history %}<details class="card sourcing-history"><summary>Change history</summary>{% for entry in history %}<details><summary>{{ entry.at|date:'M j, Y g:i A' }} · {{ entry.actor.username }}{% if entry.reason %} · {{ entry.reason }}{% endif %}</summary><p>Before</p><pre>{{ entry.before }}</pre><p>After</p><pre>{{ entry.after }}</pre></details>{% endfor %}</details>{% endif %}
