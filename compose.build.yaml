# Optional source-build path. Published releases will use a registry image.
services:
  web:
    build:
      context: ./app
      args:
        CREMA_VERSION: ${CREMA_VERSION:-development}
        CREMA_REVISION: ${CREMA_REVISION:-unknown}
  postgres:
    build:
      context: ./services
      dockerfile: database.Dockerfile
      args:
        CREMA_VERSION: ${CREMA_VERSION:-development}
        CREMA_REVISION: ${CREMA_REVISION:-unknown}
  proxy:
    build:
      context: ./services
      dockerfile: proxy.Dockerfile
      args:
        CREMA_VERSION: ${CREMA_VERSION:-development}
        CREMA_REVISION: ${CREMA_REVISION:-unknown}
